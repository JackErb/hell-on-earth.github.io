<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hell on Earth — A Point &amp; Click Cartoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:    #241233;
    --sky:    #4FC3E8;
    --sun:    #FFC93C;
    --punch:  #FF5C77;
    --paper:  #FFF6E0;
    --swamp:  #2B6E5E;
    --border-w: 4px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--sky);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    overflow-x:hidden;
  }

  h1,h2,h3{
    font-family:'Bungee', cursive;
    margin:0;
    line-height:1.05;
  }

  a{color:inherit;}

  /* ---------- wobble border utility ---------- */
  .comic-frame{
    border:var(--border-w) solid var(--ink);
    border-radius:26px 32px 22px 34px / 34px 22px 32px 26px;
    box-shadow:8px 8px 0 var(--ink);
    background:var(--paper);
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:1.5rem 1.5rem 2.5rem;
    max-width:1180px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .hero .tagline{
    margin:1.1rem 0 1.75rem;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(0.9rem, 2vw, 1.15rem);
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:10px;
    padding:0.35rem 1.5rem;
    max-width:34rem;
    transform:rotate(-1.2deg);
  }

  .hero-signup{
    background:var(--ink);
    border-top:var(--border-w) solid var(--ink);
    padding:1.4rem 1.5rem;
    /* same inset-radius nesting as .tv-screen, for the bottom corners */
    border-bottom-right-radius:18px 28px;
    border-bottom-left-radius:30px 22px;
  }
  .hero-signup-label{
    margin:0 0 1rem;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:0.85rem;
    color:var(--paper);
    line-height:1.5;
  }
  .hero-signup .ml-form{margin-top:0;}
  .hero-signup .form-msg{color:var(--paper);}
  .hero-signup .form-msg.ok{color:var(--sun);}

  .logo{
	height: 100%;
	width: 100%;
	max-width: 800px;
	margin-bottom: .5rem;
	
	object-fit: cover; /* Fills container, maintains ratio, crops edges */

  }

  /* Retro TV chassis behind the media block */
  .tv-shell{
    position:relative;
    width:min(680px, 94vw);
  }
  .tv-shell-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    overflow:visible;
  }

  /* Condensed header-image + signup block (sits "inside" the TV chassis) */
  .hero-media{
    position:relative;
    z-index:1;
    overflow:hidden;
    border:var(--border-w) solid var(--ink);
    box-shadow:10px 10px 0 var(--ink);
  }
  .tv-screen{
    aspect-ratio:16/10;
    position:relative;
    background:var(--swamp);
    display:flex;
    align-items:center;
    justify-content:center;
    /* .hero-media's border-radius shapes its OUTER (border) edge; since
       its border is 4px thick, the inner area needs a slightly smaller
       radius (outer − border width) to nest flush against it with no
       gap of the card's own background showing through */
    border-top-left-radius:22px 30px;
    border-top-right-radius:28px 18px;
  }
  .tv-screen svg{position:relative;z-index:1;}
  .tv-screen .knob{
    position:absolute;
    bottom:-2px; right:36px;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--sun);
    border:3px solid var(--ink);
  }
  .tv-screen .label{
    position:absolute;
    top:14px; left:18px;
    font-family:'Space Mono',monospace;
    font-size:0.8rem;
    color:var(--paper);
    letter-spacing:0.1em;
    opacity:0.75;
    z-index:2;
  }

  /* ---------- SECTION WRAPPER ---------- */
  section{
    position:relative;
    padding:4.5rem 1.5rem;
  }
  .section-inner{
    max-width:1080px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  .section-title{
    font-size:clamp(1.8rem, 4.4vw, 2.6rem);
    display:inline-block;
    background:var(--sun);
    border:3px solid var(--ink);
    border-radius:10px;
    padding:0.35rem 1rem;
    transform:rotate(-1deg);
    box-shadow:5px 5px 0 var(--ink);
  }

  /* ---------- SLIDESHOW (inside the TV) ---------- */
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity 0.45s ease;
  }
  
  .slide img{
	width: 100%;
	height: 100%;
	object-fit: cover; /* Fills container, maintains ratio, crops edges */
  }
  
  .slide.active{opacity:1; z-index:1;}
  .slide svg{width:60%;height:60%;}
  .slide .tag{
    position:absolute;
    bottom:12px; left:14px;
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    color:var(--paper);
    background:rgba(36,18,51,0.7);
    padding:0.25rem 0.55rem;
    border-radius:6px;
  }

  .tv-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
    width:44px;height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:var(--border-w) solid var(--ink);
    background:var(--paper);
    font-size:1.1rem;
    font-weight:900;
    line-height:1;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .tv-arrow:hover{transform:translateY(-50%) translate(-2px,-2px);}
  .tv-arrow-prev{left:14px;}
  .tv-arrow-next{right:14px;}
  .tv-arrow:active{transform:translateY(-50%) translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .tv-arrow:focus-visible{outline:3px solid var(--punch); outline-offset:2px;}

  .thumb-row{
    display:flex;
    gap:0.6rem;
    padding:0.5rem 0.5rem;
    background:var(--swamp);
    border-top:var(--border-w) solid var(--ink);
    overflow-x:auto;
  }
  .thumb{
    flex:0 0 auto;
    width:64px;
    aspect-ratio:16/10;
    border-radius:8px;
    border:2.5px solid var(--paper);
    padding:0;
    cursor:pointer;
    overflow:hidden;
    opacity:0.65;
    transition:opacity 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    background:#1c2f3a;
  }
  .thumb img{width:100%;height:100%;display:block;}
  .thumb:hover{opacity:0.9; transform:translateY(-2px);}
  .thumb.active{opacity:1; border-color:var(--sun);}
  .thumb:focus-visible{outline:3px solid var(--sun); outline-offset:2px;}

  /* ---------- BLURB ---------- */
  .blurb-section{background:var(--paper); border-top:var(--border-w) solid var(--ink); border-bottom:var(--border-w) solid var(--ink);}
  .blurb-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:2rem;
    align-items:start;
  }
  .blurb-text p{
    font-size:1.08rem;
    line-height:1.65;
    margin:0 0 1rem;
  }
  .blurb-text p:last-child{margin-bottom:0;}

  /* ---------- shared signup form styling ---------- */

  .ml-form{
    margin-top:1.8rem;
    display:flex;
    flex-wrap:wrap;
    gap:0.8rem;
    justify-content:center;
  }
  .ml-form input[type=email]{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:1rem;
    padding:0.85rem 1.1rem;
    border-radius:10px;
    border:3px solid var(--ink);
    min-width:260px;
    flex:1 1 260px;
    max-width:340px;
  }
  .ml-form input[type=email]:focus-visible{outline:3px solid var(--sun); outline-offset:2px;}

  .join-btn{
    font-family:'Bungee', cursive;
    font-size:0.95rem;
    color:var(--ink);
    background:var(--sun);
    border:3px solid var(--ink);
    border-radius:10px;
    padding:0.85rem 1.6rem;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform 0.15s ease;
  }
  .join-btn:hover{transform:translate(-2px,-2px);}
  .join-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .join-btn:focus-visible{outline:3px solid var(--paper); outline-offset:3px;}
  .join-btn:disabled{opacity:0.6; cursor:progress;}

  .form-msg{
    margin-top:1rem;
    font-family:'Space Mono', monospace;
    font-size:0.82rem;
    min-height:1.2em;
  }
  .form-msg.ok{color:var(--sun);}
  .form-msg.err{color:#FFD1D9;}

  /* ---------- FOOTER TICKER ---------- */
  footer{
    background:var(--swamp);
    color:var(--paper);
    padding:1rem 0;
    overflow:hidden;
    border-top:var(--border-w) solid var(--ink);
  }
  .ticker{
    display:flex;
    white-space:nowrap;
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.08em;
    animation:scroll-left 22s linear infinite;
  }
  .ticker span{padding-right:2.5rem;}
  @keyframes scroll-left{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .site-footer{
    text-align:center;
  }
  .site-footer p{
    margin:0;
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    letter-spacing:0.04em;
  }
  .site-footer a{
    color:var(--sun);
    text-decoration:underline;
  }
  .site-footer a:hover,
  .site-footer a:focus-visible{color:var(--paper);}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .ticker{animation:none;}
    .tv-arrow,.join-btn{transition:none;}
  }

  @media (min-width:760px){
    .blurb-grid{grid-template-columns:1.1fr 0.9fr;}
  }
</style>

<script>
(function(){
  /* ---------------- Slideshow ---------------- */
  const slides = Array.from(document.querySelectorAll('.slide'));
  const thumbRow = document.getElementById('thumbRow');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  let current = 0;

  // Build one thumbnail preview per slide (including the header image)
  // so people can jump straight to any image.
  slides.forEach((slide, i) => {
    const thumb = document.createElement('button');
    thumb.className = 'thumb';
    thumb.type = 'button';
    thumb.setAttribute('role', 'tab');
    thumb.setAttribute('aria-label', i === 0 ? 'Show header image' : 'Show screenshot ' + i);
    if (i === 0) thumb.classList.add('active');
    const svgClone = slide.querySelector('img').cloneNode(true);
    thumb.appendChild(svgClone);
    thumb.addEventListener('click', () => goTo(i));
    thumbRow.appendChild(thumb);
  });
  const thumbs = Array.from(thumbRow.children);

  function goTo(index){
    slides[current].classList.remove('active');
    thumbs[current].classList.remove('active');
    current = (index + slides.length) % slides.length;
    slides[current].classList.add('active');
    thumbs[current].classList.add('active');
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  /* ---------------- MailerLite signup ----------------
     HOW TO WIRE THIS UP TO YOUR OWN MAILERLITE ACCOUNT:

     1. In MailerLite: Forms > Embedded forms > create (or open) a form,
        assign it to the subscriber group you want new playtesters in.
     2. On the form's editor, choose the "HTML code" embed option and
        find the <form action="..."> URL. It looks like:
          https://assets.mailerlite.com/jsonp/XXXXXX/forms/YYYYYYYYYYYYYYYYYY/subscribe
        (the first number is your account ID, the second is the form ID).
     3. Set ML_FORM_ACTION below to that exact URL.
     4. Check that generated HTML for any extra hidden <input> fields
        (MailerLite sometimes adds one for anti-spam / group targeting).
        If there are any, copy them into the form in the HTML above, right
        where the comment says to.
     5. That's it — no API key belongs in client-side code. This endpoint
        is MailerLite's public embedded-form submission URL, meant to be
        posted to from the browser, same as the <form action> you'd get
        from their own embed snippet. (This is different from MailerLite's
        REST API, which uses a private Bearer-token API key — that key
        must never be placed in client-side JS, since anyone could view
        it in the page source and use it to access your whole account.)
  ------------------------------------------------------ */

  const ML_FORM_ACTION = "https://assets.mailerlite.com/jsonp/2604574/forms/197195424523617774/subscribe";

  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  document.querySelectorAll('[data-ml-form]').forEach(function(form){
    const emailInput = form.querySelector('.ml-email');
    const submitBtn = form.querySelector('.ml-submit');
    const msg = form.parentElement.querySelector('[data-ml-msg]');

    function setMsg(text, kind){
      msg.textContent = text;
      msg.className = 'form-msg' + (kind ? ' ' + kind : '');
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();

      const email = emailInput.value.trim();
      if (!isValidEmail(email)){
        setMsg('That email doesn\u2019t look right — double check it.', 'err');
        emailInput.focus();
        return;
      }

      submitBtn.disabled = true;
      setMsg('Sending\u2026', '');

      // MailerLite's embedded-form endpoint can't be read via fetch() due
      // to CORS, so we submit the real form to a hidden iframe. MailerLite
      // will process the subscription server-side regardless of what the
      // (blocked) response looks like to us.
      const iframe = document.getElementById('hidden_ml_iframe');
      let settled = false;

      function finish(){
        if (settled) return;
        settled = true;
        submitBtn.disabled = false;
        setMsg('You\u2019re on the list. Watch your inbox for playtest access.', 'ok');
        form.reset();
      }

      iframe.addEventListener('load', finish, { once: true });
      // Fallback in case the iframe load event doesn't fire in time.
      setTimeout(finish, 4000);

      form.action = ML_FORM_ACTION;
      form.method = 'POST';
      form.target = 'hidden_ml_iframe';
      form.submit();
    });
  });
})();
</script>
